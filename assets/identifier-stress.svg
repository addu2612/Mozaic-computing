<svg xmlns="http://www.w3.org/2000/svg" width="940" height="286" viewBox="0 0 940 286" role="img" aria-labelledby="t d">
<title id="t">Association sensitivity to missing identifiers</title>
<desc id="d">Mean pair F1 was 0.557 with identifiers intact and 0.016 after full identifier dropout on the five Round 8 synthetic confirmation seeds.</desc>
<rect width="940" height="286" rx="23" fill="#101828"/>
<g font-family="sans-serif">
<text x="38" y="51" fill="#f6f9ff" font-size="25" font-weight="700">How much do identifiers matter?</text>
<text x="38" y="80" fill="#a9bad8" font-size="16">Gated association, mean pair F1 across five synthetic confirmation seeds</text>
<text x="38" y="134" fill="#e7efff" font-size="17">Identifiers intact</text>
<text x="38" y="188" fill="#e7efff" font-size="17">Full dropout</text>
<rect x="234" y="111" width="570" height="31" rx="7" fill="#283855"/>
<rect x="234" y="165" width="570" height="31" rx="7" fill="#283855"/>
<rect x="234" y="111" width="317.34" height="31" rx="7" fill="#8facff"/>
<rect x="234" y="165" width="9.12" height="31" rx="4" fill="#f8c58a"/>
<text x="832" y="133" fill="#e7efff" font-size="22" font-weight="700">0.557</text>
<text x="832" y="187" fill="#e7efff" font-size="22" font-weight="700">0.016</text>
<text x="234" y="220" fill="#a9bad8" font-size="13">0</text>
<text x="804" y="220" text-anchor="end" fill="#a9bad8" font-size="13">1</text>
<text x="38" y="251" fill="#a9bad8" font-size="15">Same records and reference labels in both conditions. Background pairs are included.</text>
</g>
</svg>
