<text x="45" y="218">CloudWatch</text><text x="45" y="243">Grafana</text>
<text x="296" y="130" font-weight="bold">Common record schema</text>
<text x="296" y="170">Normalize text and metrics</text>
<text x="296" y="200">Add earlier records from the</text><text x="296" y="222">same source, service and split</text>
<text x="296" y="253">Encode with fixed MiniLM</text>
<text x="566" y="124"><tspan font-weight="bold">Detection</tspan><tspan x="688">Record scores</tspan></text>
<text x="566" y="170"><tspan font-weight="bold">Association</tspan><tspan x="688">Cross-source pairs</tspan></text>
<text x="566" y="216"><tspan font-weight="bold">Clustering</tspan><tspan x="688">Group assignments</tspan></text>
<text x="566" y="262"><tspan font-weight="bold">Labelling</tspan><tspan x="688">Scenario families</tspan></text>
<text x="45" y="350"><tspan font-weight="bold">Reference labels</tspan><tspan x="181">Kept out of encoder input; used for splitting, target selection or scoring as specified.</tspan></text>
</g>
