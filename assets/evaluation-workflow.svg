<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="title desc">
<title id="title">MOZAIC from telemetry to evaluation</title>
<desc id="desc">Four replay sources feed MCP time-window queries, a common schema and context from prior records. Fixed embeddings feed separate detection, association, clustering and scenario labelling tasks. Reference labels are kept out of the encoder and used where the protocol requires them for sampling and scoring.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#3b5778"/></marker>
